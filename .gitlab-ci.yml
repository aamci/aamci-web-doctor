# ─── CI/CD — Web Pro Next.js (@health/web-pro) ───────────────────────────────
#
# Pipeline autonome déclenché par le pipeline racine via `trigger: include:`.
# Peut aussi être utilisé directement sur le dépôt de l'app si nécessaire.
#
# Déclencheurs (gérés par le pipeline racine) :
#   • Push sur une branche / MR   → test
#   • Push sur main               → test + build image + deploy staging
#   • Tag web-pro/v*.*.*          → test + build image + deploy production (manuel)
#
# Variables à configurer (GitLab → Settings → CI/CD → Variables) :
#   WEB_PRO_STAGING_DEPLOY_HOOK      URL webhook staging
#   WEB_PRO_PROD_DEPLOY_HOOK         URL webhook production
#   NEXT_PUBLIC_API_BASE_URL_STAGING URL API pour l'image staging
#   NEXT_PUBLIC_API_BASE_URL_PROD    URL API pour l'image production

stages:
  - test
  - build
  - staging
  - production

.web-pro-node-base:
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm install --no-frozen-lockfile

# ── Validation README ─────────────────────────────────────────────────────────

validate:readme:web-pro:
  image: node:20-alpine
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^web-pro\/v.*/
  script:
    - node scripts/validate-readme.js
  allow_failure: false

# ── Test ──────────────────────────────────────────────────────────────────────

test:web-pro:
  extends: .web-pro-node-base
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^web-pro\/v.*/
  script:
    - pnpm test:run
  coverage: '/Lines\s*:\s*\d+\.?\d+%/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

# ── Build image Docker (staging) ──────────────────────────────────────────────

build:web-pro:staging:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["test:web-pro"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/web-pro:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/web-pro:staging"
      --build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL_STAGING"
      --cache=true
      --cache-ttl=24h

build:web-pro:production:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["test:web-pro"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^web-pro\/v.*/
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/web-pro:$CI_COMMIT_TAG"
      --destination "$CI_REGISTRY_IMAGE/web-pro:latest"
      --build-arg "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL_PROD"
      --cache=true
      --cache-ttl=24h

# ── Deploy staging ────────────────────────────────────────────────────────────

deploy:web-pro:staging:
  stage: staging
  image: alpine:latest
  needs: ["build:web-pro:staging"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: web-pro/staging
    url: $WEB_PRO_STAGING_URL
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -n "$WEB_PRO_STAGING_DEPLOY_HOOK" ]; then
        curl -f -s -X POST "$WEB_PRO_STAGING_DEPLOY_HOOK"
        echo "Deploy staging déclenché."
      else
        echo "WEB_PRO_STAGING_DEPLOY_HOOK non définie — deploy ignoré."
      fi

# ── Deploy production ─────────────────────────────────────────────────────────

deploy:web-pro:production:
  stage: production
  image: alpine:latest
  needs: ["build:web-pro:production"]
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^web-pro\/v.*/
      when: manual
  environment:
    name: web-pro/production
    url: $WEB_PRO_PROD_URL
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -n "$WEB_PRO_PROD_DEPLOY_HOOK" ]; then
        curl -f -s -X POST "$WEB_PRO_PROD_DEPLOY_HOOK"
        echo "Deploy production déclenché."
      else
        echo "WEB_PRO_PROD_DEPLOY_HOOK non définie — deploy ignoré."
      fi
